syntax = "proto3";

package netspectre.v1;

// One finished network flow, as produced by the Rust core.
message FlowFeatures {
  string src_ip = 1;
  uint32 src_port = 2;
  string dst_ip = 3;
  uint32 dst_port = 4;
  uint32 protocol = 5;          // 6 = TCP, 17 = UDP
  uint64 timestamp_us = 6;      // flow end time, microseconds since epoch
  // 35 values, in the order of ml/models/feature_cols_35.json
  repeated float features = 7;
}

// One of the top features behind an attack verdict (TreeSHAP).
message Reason {
  string feature = 1;           // model feature name
  string text = 2;              // plain-English phrase with the observed value
  float weight = 3;             // share among the top reasons, 0..100
}

// The model's verdict for one flow.
message Classification {
  string label = 1;             // e.g. "BENIGN", "PortScan"
  float confidence = 2;         // probability of the predicted label, 0..1
  repeated Reason reasons = 3;  // top 3 reasons, only for attack verdicts
  float anomaly_score = 4;      // autoencoder reconstruction error, higher = more unusual
}

// A grouped incident (e.g. one source scanning many ports).
message Alert {
  string src_ip = 1;
  string label = 2;
  uint32 flow_count = 3;
  float avg_confidence = 4;
  uint64 first_seen_us = 5;
  uint64 last_seen_us = 6;
}

service Inference {
  // Classify one flow.
  rpc Classify(FlowFeatures) returns (Classification);
  // Continuous mode: the Rust core streams flows, the ML service streams verdicts back.
  rpc ClassifyStream(stream FlowFeatures) returns (stream Classification);
}
