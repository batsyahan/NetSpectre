server {
  listen 5173;
  root /usr/share/nginx/html;
  index index.html;
  location = /api/stream {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
  location /api/ {
    proxy_pass http://127.0.0.1:8080;
  }
  location / {
    try_files $uri /index.html;
  }
}
