services:
  ml:
    build: ./ml
    image: netspectre-ml
    ports:
      - "127.0.0.1:50051:50051"
    environment:
      NS_MODEL: ${NS_MODEL:-multiclass_xgb35_v3}      # v4 (own-network retrain) tested worse on CICIDS and no better live
      NS_AE_MODEL: ${NS_AE_MODEL:-ae35_v2}            # autoencoder trained on CICIDS + own-network normal traffic
    restart: unless-stopped

  monitor:
    build:
      context: .
      dockerfile: core/Dockerfile
    image: netspectre-core
    network_mode: host          # needed to capture packets on the host's interface
    cap_add: [NET_RAW, NET_ADMIN]
    command: ["${NS_IFACE:-lo}"]   # set NS_IFACE=eth1 (Wi-Fi) for live monitoring
    environment:
      NS_DB: /data/netspectre.db
      NS_ML_ADDR: http://127.0.0.1:50051
      NS_API_ADDR: 0.0.0.0:8080
      NS_API_TOKEN: ${NS_API_TOKEN:-}
      NS_NTFY_TOPIC: ${NS_NTFY_TOPIC:-}
      NS_NTFY_MIN_SEVERITY: ${NS_NTFY_MIN_SEVERITY:-medium}
      NS_ANOMALY_IGNORE: 10.255.255.254   # trusted sources (comma-separated), e.g. your router's DNS
      NS_MAX_FLOWS: ${NS_MAX_FLOWS:-100000}        # flood protection: flows tracked at once
      NS_QUEUE_MAX: ${NS_QUEUE_MAX:-20000}         # finished flows waiting for the classifier
      NS_AE_THRESHOLD: ${NS_AE_THRESHOLD:-0.645}   # ae35_v2: <=0.5% false alarms on own held-out traffic
    volumes:
      - ./data:/data
    depends_on: [ml]
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    image: netspectre-dashboard
    network_mode: host
    depends_on: [monitor]
    restart: unless-stopped
