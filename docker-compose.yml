services:
  ml:
    build: ./ml
    image: netspectre-ml
    ports:
      - "127.0.0.1:50051:50051"
    environment:
      NS_MODEL: ${NS_MODEL:-multiclass_xgb35_v7}      # v4 (own-network retrain) tested worse on CICIDS and no better live
      NS_AE_MODEL: ${NS_AE_MODEL:-ae35_v2}            # autoencoder trained on CICIDS + own-network normal traffic
    restart: unless-stopped

  monitor:
    build:
      context: .
      dockerfile: core/Dockerfile
    image: netspectre-core
    network_mode: host          # needed to capture packets on the host's interface
    cap_add: [NET_RAW, NET_ADMIN]
    command: ["${NS_IFACE:-lo}"]   # set NS_IFACE=eth1 (Wi-Fi) for live monitoring
    environment:
      NS_DB: /data/netspectre.db
      NS_ML_ADDR: http://127.0.0.1:50051
      NS_API_ADDR: 0.0.0.0:8080
      NS_API_TOKEN: ${NS_API_TOKEN:-}
      NS_NTFY_TOPIC: ${NS_NTFY_TOPIC:-}
      NS_NTFY_MIN_SEVERITY: ${NS_NTFY_MIN_SEVERITY:-medium}
      NS_SLACK_WEBHOOK: ${NS_SLACK_WEBHOOK:-}          # Slack incoming webhook URL (keep secret, set in .env)
      NS_SLACK_MIN_SEVERITY: ${NS_SLACK_MIN_SEVERITY:-medium}
      NS_SMTP_HOST: ${NS_SMTP_HOST:-smtp.gmail.com}   # email alerts (SMTPS, port 465); off unless user + app password are set
      NS_SMTP_USER: ${NS_SMTP_USER:-}
      NS_SMTP_PASS: ${NS_SMTP_PASS:-}                  # Gmail: a 16-character App Password, never your normal password
      NS_EMAIL_TO: ${NS_EMAIL_TO:-}                    # defaults to NS_SMTP_USER
      NS_EMAIL_MIN_SEVERITY: ${NS_EMAIL_MIN_SEVERITY:-medium}
      NS_EMAIL_MAX_PER_HOUR: ${NS_EMAIL_MAX_PER_HOUR:-20}
      NS_ANOMALY_IGNORE: 10.255.255.254   # trusted sources (comma-separated), e.g. your router's DNS
      NS_GEOIP_DB: /geo/dbip-country-lite.mmdb
      NS_MAX_FLOWS: ${NS_MAX_FLOWS:-100000}        # flood protection: flows tracked at once
      NS_QUEUE_MAX: ${NS_QUEUE_MAX:-20000}         # finished flows waiting for the classifier
      NS_AE_THRESHOLD: ${NS_AE_THRESHOLD:-0.645}   # ae35_v2: <=0.5% false alarms on own held-out traffic
    volumes:
      - ./data:/data
      - ./geo:/geo:ro                 # optional country database (scripts/get_geoip.sh)
    depends_on: [ml]
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    image: netspectre-dashboard
    network_mode: host
    depends_on: [monitor]
    restart: unless-stopped
